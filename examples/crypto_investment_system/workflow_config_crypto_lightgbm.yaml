qlib_init:
    provider_uri: "~/.qlib/qlib_data/crypto_data"
    # Crypto isn't a first-class qlib "region" (only cn/us/tw ship trading-calendar
    # defaults). "us" is used here purely as a base for defaults we then override
    # below (no price limits, no lot-size rounding) -- it does not imply a US-market
    # trading calendar is applied; qlib derives the calendar from the dumped data itself.
    region: us
# "all" is auto-generated by scripts/dump_bin.py from every symbol the collector
# downloaded -- i.e. every USD-quoted spot product Coinbase listed at collection time.
market: &market all
benchmark: &benchmark BTC-USD
data_handler_config: &data_handler_config
    start_time: 2018-01-01
    end_time: 2026-08-01
    fit_start_time: 2018-01-01
    fit_end_time: 2023-12-31
    instruments: *market
port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 15
            n_drop: 2
    backtest:
        start_time: 2024-01-01
        end_time: 2026-08-01
        account: 100000
        benchmark: *benchmark
        exchange_kwargs:
            # Crypto trades 24/7 with no daily price-move limits and no lot-size
            # rounding requirement -- unlike equities, neither applies here.
            limit_threshold: null
            trade_unit: null
            deal_price: close
            # Coinbase's default (non-volume-discounted) taker fee is roughly
            # 0.6% per side -- adjust to your actual fee tier.
            open_cost: 0.006
            close_cost: 0.006
            min_cost: 0
task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.2
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 8
            num_leaves: 210
            num_threads: 20
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2018-01-01, 2023-12-31]
                valid: [2024-01-01, 2024-12-31]
                test: [2025-01-01, 2026-08-01]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 365  # crypto trades every day of the year, not ~252 trading days
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config
